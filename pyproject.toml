[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cfd-close-enough"
version = "0.1.0"
description = "Beginner-friendly CFD playground: NACA/KF airfoil generation and a D2Q9 lattice Boltzmann solver"
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "pygame",
]

[project.optional-dependencies]
# Only geometry.py (3D NACA mesh export) needs pyvista; the 2D wind tunnel
# and its tests run without it, and the geometry tests skip gracefully.
mesh3d = [
    "pyvista",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

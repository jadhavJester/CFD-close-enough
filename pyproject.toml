[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cfd-close-enough"
version = "0.1.0"
description = "Beginner-friendly CFD playground: NACA/KF airfoil generation and a D2Q9 lattice Boltzmann solver"
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "pygame",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
